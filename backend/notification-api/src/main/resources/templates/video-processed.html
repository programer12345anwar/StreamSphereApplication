<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Video Processed</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="background: #ffffff; padding: 20px; border-radius: 8px;">
        <h2 style="color: #333333;">Your video is ready!</h2>
        <p>Hello,</p>
        <p>Your video <strong th:text="${videoName}">Video</strong> has finished processing and is now published on <span th:text="${platformName}">StreamSphere</span>.</p>
        <a th:href="${watchUrl}" style="display: inline-block; padding: 10px 20px; background-color: #ff0000; color: #ffffff; text-decoration: none; border-radius: 5px; margin-top: 20px;">Watch Now</a>
    </div>
</body>
</html>
