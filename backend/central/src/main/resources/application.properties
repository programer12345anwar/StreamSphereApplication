spring.application.name=central
server.port=${PORT:${SERVER_PORT:8084}}

# RabbitMQ (Connection)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ (Custom App Config)
rabbitmq.exchange.name=${RABBITMQ_EXCHANGE_NAME:notification-exchange}
rabbitmq.queue.name=${RABBITMQ_QUEUE_NAME:notification-queue}
rabbitmq.routing.key=${RABBITMQ_ROUTING_KEY:notification-123}

# Database - Local Setup
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stream_sphere_application_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
# Adopt existing databases that predate Flyway: baseline at V1 instead of failing.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Security Key
central.security.secret.key=${CENTRAL_SECRET_KEY:}

# App Config
app.cors.enabled=${CORS_ENABLED:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8080,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:8084}
app.docs.external-url=${APP_DOCS_EXTERNAL_URL:https://docs.streamsphere.com/central}

# Swagger Aggregator
springdoc.swagger-ui.urls[0].name=Central API
springdoc.swagger-ui.urls[0].url=${CENTRAL_SWAGGER_DOCS_URL:http://localhost:8084/v3/api-docs}

springdoc.swagger-ui.urls[1].name=Video API
springdoc.swagger-ui.urls[1].url=${VIDEO_SWAGGER_DOCS_URL:http://localhost:8083/v3/api-docs}

springdoc.swagger-ui.urls[2].name=Notification API
springdoc.swagger-ui.urls[2].url=${NOTIFICATION_SWAGGER_DOCS_URL:http://localhost:8082/v3/api-docs}

springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.api-docs.path=${API_DOCS_PATH:/v3/api-docs}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSE:health,info,caches,metrics}
management.endpoint.health.probes.enabled=true

# Redis cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
# Redis failures must fall back to the database, never fail the request.
spring.cache.redis.fail-on-keys-deserialization-failure=false
logging.level.org.springframework.data.redis=WARN
