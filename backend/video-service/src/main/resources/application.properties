spring.application.name=video-service
server.port=${PORT:${SERVER_PORT:8083}}

image.url.endpoint=${IMAGE_URL:http://localhost:8080}
image.private.key=${IMAGE_PRIVATE_KEY:}
image.public.key=${IMAGE_PUBLIC_KEY:}
video.upload.max-bytes=${VIDEO_UPLOAD_MAX_BYTES:104857600}
video.thumbnail.max-bytes=${VIDEO_THUMBNAIL_MAX_BYTES:5242880}
video.thumbnail.min-width=${VIDEO_THUMBNAIL_MIN_WIDTH:160}
video.thumbnail.min-height=${VIDEO_THUMBNAIL_MIN_HEIGHT:90}
video.thumbnail.max-width=${VIDEO_THUMBNAIL_MAX_WIDTH:4096}
video.thumbnail.max-height=${VIDEO_THUMBNAIL_MAX_HEIGHT:4096}
video.thumbnail.max-pixels=${VIDEO_THUMBNAIL_MAX_PIXELS:16777216}
video.thumbnail.download-timeout-ms=${VIDEO_THUMBNAIL_DOWNLOAD_TIMEOUT_MS:10000}
video.thumbnail.process-timeout-seconds=${VIDEO_THUMBNAIL_PROCESS_TIMEOUT_SECONDS:60}
video.thumbnail.max-attempts=${VIDEO_THUMBNAIL_MAX_ATTEMPTS:3}
video.thumbnail.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
video.thumbnail.ffprobe-path=${FFPROBE_PATH:ffprobe}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:${RABBITMQ_VIRTUAL_HOST:/}}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:${RABBITMQ_SSL_ENABLED:false}}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=${RABBITMQ_RETRY_INITIAL_INTERVAL:1000}
spring.rabbitmq.listener.simple.retry.multiplier=${RABBITMQ_RETRY_MULTIPLIER:2.0}
spring.rabbitmq.listener.simple.retry.max-attempts=${RABBITMQ_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
thumbnail.events.exchange=${VIDEO_THUMBNAIL_EXCHANGE:streamsphere-video-events}
thumbnail.events.request-queue=${VIDEO_THUMBNAIL_REQUEST_QUEUE:streamsphere-video-thumbnail-requests}
thumbnail.events.request-routing-key=${VIDEO_THUMBNAIL_REQUEST_ROUTING_KEY:video.thumbnail.requested}
thumbnail.events.result-queue=${VIDEO_THUMBNAIL_RESULT_QUEUE:streamsphere-central-video-thumbnail-results}
thumbnail.events.result-routing-key=${VIDEO_THUMBNAIL_RESULT_ROUTING_KEY:video.thumbnail.completed}
thumbnail.events.dlx=${VIDEO_THUMBNAIL_DLX:streamsphere-video-events.dlx}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:500MB}
central.api.url=${CENTRAL_API_URL:${CENTRAL_SERVICE_URL:http://${CENTRAL_SERVICE_HOSTPORT:localhost:8084}}/api/v1/central}
central.internal-service-token=${CENTRAL_INTERNAL_SERVICE_TOKEN:}
app.cors.enabled=${CORS_ENABLED:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8082,http://localhost:8083,http://localhost:8084,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8080,http://127.0.0.1:8082,http://127.0.0.1:8083,http://127.0.0.1:8084}
app.docs.external-url=${APP_DOCS_EXTERNAL_URL:https://docs.streamsphere.com/video}

springdoc.swagger-ui.path=${SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.api-docs.path=${API_DOCS_PATH:/v3/api-docs}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_EXPOSE:health,info}
management.endpoint.health.probes.enabled=true

