name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test central
        run: mvn -B clean test
        working-directory: backend/central

      - name: Build & test video-service
        run: mvn -B clean test
        working-directory: backend/video-service

      - name: Build & test notification-api
        run: mvn -B clean test
        working-directory: backend/notification-api

      - name: Build & test api-gateway
        run: mvn -B clean test
        working-directory: backend/api-gateway

      - name: Validate docker compose
        run: docker compose -f backend/docker-compose.yml config --quiet

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & test
        run: |
          npm ci
          npm run test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
